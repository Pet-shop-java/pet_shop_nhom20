# ===============================
# Application
# ===============================
spring.application.name=Pet_Shop
server.port=8080

# ===============================
# Cache (Caffeine)
# ===============================
spring.cache.type=caffeine
spring.cache.cache-names=product_list,product_detail
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=10m

# ===============================
# Datasource (MySQL - Docker / Production)
# ===============================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh

spring.jackson.time-zone=Asia/Ho_Chi_Minh
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false

# ===============================
# Pageable
# ===============================
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.one-indexed-parameters=true
spring.data.web.pageable.page-parameter=pageNumber
spring.data.web.pageable.size-parameter=size
spring.data.web.sort.sort-parameter=sort

# ===============================
# Security / JWT
# ===============================
signerKey=${JWT_SIGNER_KEY}
valid-duration=3600
refreshable-duration=604800

# ===============================
# Error handling
# ===============================
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always

# ===============================
# Logging
# ===============================
logging.level.org.springframework.web=INFO
logging.level.org.springframework.http.converter.json=INFO
logging.level.com.fasterxml.jackson.databind=INFO

# ===============================
# Mail
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===============================
# Cloudinary
# ===============================
cloudinaryName=${CLOUDINARY_NAME}
cloudinaryKey=${CLOUDINARY_KEY}
cloudinarySecretKey=${CLOUDINARY_SECRET}

# ===============================
# File upload
# ===============================
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true

# ===============================
# VNPAY
# ===============================
vnp_TmnCode=${VNP_TMN_CODE}
vnp_HashSecret=${VNP_HASH_SECRET}
vnp_Version=2.1.0
vnp_Command=pay

# ===============================
# Gemini AI
# ===============================
gemini.api-key=${GEMINI_API_KEY}
gemini.embed-url=https://generativelanguage.googleapis.com/v1beta/models/text-embedding-004:embedContent
gemini.chat-url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent
gemini.chat-timeout-seconds=30
gemini.embed-timeout-seconds=30

# ===============================
# Qdrant
# ===============================
qdrant.url=${QDRANT_URL}
qdrant.api-key=${QDRANT_API_KEY}
qdrant.collection=petshop_kb_v1

# ===============================
# Importer
# ===============================
importer.sheetName=petshop_kb_vi
importer.batchSize=64

# ===============================
# Service text builder
# ===============================
service.text.template=default

# ===============================
# Devtools
# ===============================
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false
